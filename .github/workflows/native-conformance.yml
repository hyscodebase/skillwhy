name: Native conformance (opt-in)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Candidate uses a temporary build; supported tests the production manifest.
        type: choice
        options:
          - candidate-linux-x64
          - supported
        default: candidate-linux-x64
        required: true

permissions:
  contents: read

jobs:
  native-metadata:
    name: Codex 0.166.0 / Linux x64 / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22.20.0', '24.8.0']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install the exact native host in runner-local storage
        run: npm install --prefix "$RUNNER_TEMP/skillwhy-codex" --no-audit --no-fund --save-exact @openai/codex@0.166.0
      - name: Run native metadata fixtures without login or model turns
        env:
          NATIVE_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          test "$(node -p 'process.platform + "/" + process.arch')" = linux/x64
          case "$NATIVE_MODE" in
            candidate-linux-x64)
              node scripts/native-conformance.mjs --live --candidate linux-x64 --codex-bin "$RUNNER_TEMP/skillwhy-codex/node_modules/.bin/codex" > native-summary.json
              ;;
            supported)
              node scripts/native-conformance.mjs --live --codex-bin "$RUNNER_TEMP/skillwhy-codex/node_modules/.bin/codex" > native-summary.json
              ;;
            *) exit 2 ;;
          esac
      - name: Upload the sanitized summary only
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-codex-0.166.0-linux-x64-node-${{ matrix.node }}-${{ inputs.mode }}
          path: native-summary.json
          if-no-files-found: error
          retention-days: 30
