name: GitHub prerelease

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node scripts/release-check.mjs
        env:
          RELEASE_TAG: ${{ github.ref_name }}

  test:
    needs: validate
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [validate, test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: node scripts/release-check.mjs
      - run: npm ci
      - name: Pack, install into an isolated prefix, smoke test and checksum
        run: node scripts/release-build.mjs
        env:
          RELEASE_DIR: ${{ runner.temp }}/skillwhy-release
      - name: Publish verified assets as a GitHub prerelease
        run: node scripts/release-publish.mjs
        env:
          RELEASE_DIR: ${{ runner.temp }}/skillwhy-release
          GH_TOKEN: ${{ github.token }}
