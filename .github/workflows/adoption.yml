name: Weekly public adoption record

on:
  schedule:
    - cron: "23 1 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-adoption-record
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Read public GitHub aggregates and write the job summary
        run: node scripts/adoption-report.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          ADOPTION_REPORT_DIR: ${{ runner.temp }}/skillwhy-adoption
      - name: Keep Markdown and JSON observations for 30 days
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: public-adoption-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/skillwhy-adoption/
          if-no-files-found: error
          retention-days: 30
