name: Weekly public adoption record

on:
  schedule:
    - cron: "23 1 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-adoption-record
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - name: Read public GitHub aggregates and write the job summary
        run: node scripts/adoption-report.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          ADOPTION_REPORT_DIR: ${{ runner.temp }}/skillwhy-adoption
      - name: Keep Markdown and JSON observations for 30 days
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-adoption-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/skillwhy-adoption/
          if-no-files-found: error
          retention-days: 30
